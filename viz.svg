<text x="56.0" y="316.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Union-Find processes edges in order: (1,2) merges, (1,3) merges — then (2,3) arrives</text>
<text x="56.0" y="335.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">with 2 and 3 ALREADY in one set. That union would close a cycle: it's the culprit.</text>
