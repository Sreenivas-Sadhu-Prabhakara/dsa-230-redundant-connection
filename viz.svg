<text x="56.0" y="516.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Answer: [2,3]. 'First edge whose endpoints already share a root' is exactly</text>
<text x="56.0" y="535.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Kruskal's reject test (dsa-169) — here the reject IS the answer.</text>
